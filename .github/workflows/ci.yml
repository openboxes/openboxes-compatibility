# Checks for this repository's own changes: lint and typecheck, then the quick
# lane - boot two published OpenBoxes images, run the same checks on both, and
# compare. Needs no secrets, so pull requests from forks run it in full.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Published images, pinned by digest.
  BASELINE_LABEL: image-v0.9.8
  BASELINE_IMAGE: ghcr.io/openboxes/openboxes:v0.9.8@sha256:117b40a462c2a9edc29592ce88b8c659e4241f4779f8d85de8639b9b010fa9e8
  CANDIDATE_LABEL: image-v0.9.9
  CANDIDATE_IMAGE: ghcr.io/openboxes/openboxes:v0.9.9@sha256:40306240e05a2ab26848b1154684496743c8a3b8b34bf0bedc26e815e622c820

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: shellcheck
        run: shellcheck scripts/*.sh

  lane:
    name: lane (${{ matrix.side }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        side: [baseline, candidate]
    env:
      OB_BASE_URL: http://localhost:8080/openboxes
    steps:
      - name: Select the target
        run: |
          if [ "${{ matrix.side }}" = baseline ]; then
            echo "OB_LABEL=$BASELINE_LABEL" >>"$GITHUB_ENV"
            echo "OB_IMAGE_REF=$BASELINE_IMAGE" >>"$GITHUB_ENV"
          else
            echo "OB_LABEL=$CANDIDATE_LABEL" >>"$GITHUB_ENV"
            echo "OB_IMAGE_REF=$CANDIDATE_IMAGE" >>"$GITHUB_ENV"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Boot the stack and record deployment facts
        id: stack
        continue-on-error: true
        run: scripts/stack.sh up "$OB_LABEL" "$OB_IMAGE_REF"
      - name: Confirm the app still answers
        id: check
        if: steps.stack.outcome == 'success'
        continue-on-error: true
        run: scripts/stack.sh check "$OB_LABEL"
      - name: Run the API and page checks
        if: steps.check.outcome == 'success'
        # The verdict comes from the compare job, not from this step.
        continue-on-error: true
        run: npx playwright test
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ env.OB_LABEL }}
          path: results/${{ env.OB_LABEL }}/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop the stack
        if: always()
        run: scripts/stack.sh down "$OB_LABEL"

  compare:
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: artifacts/
      - name: Arrange results
        run: |
          mkdir -p results
          for dir in artifacts/results-*; do
            [ -d "$dir" ] && mv "$dir" "results/${dir#artifacts/results-}"
          done
          ls results
      - name: Compare (fails on FAIL or INCONCLUSIVE)
        run: npm run compare -- --baseline "$BASELINE_LABEL" --candidate "$CANDIDATE_LABEL" --out report
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-report
          path: report/
          retention-days: 30
